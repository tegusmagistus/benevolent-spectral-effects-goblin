name: Verify sigil-metal console
on:
  push:
    branches: [main]
    paths:
      - 'public/console-metal.css'
      - 'public/assets/sigil-metal-*.svg'
      - 'refine-header.mjs'
      - 'tests/verify-metal.cjs'
      - '.github/workflows/verify-metal.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node prepare-site.mjs
      - run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - run: node tests/verify-metal.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bseg-sigil-metal-011
          path: |
            metal-results/
            public/
          retention-days: 7
