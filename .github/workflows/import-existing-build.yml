name: Import preserved BSEG application

on:
  push:
    branches: [main]
    paths: [BSEG_Moon_Relic_Web.zip]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bseg-preserved-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing repository
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Verify and unpack the preserved app
        run: node prepare-site.mjs
      - name: Save unchanged app files in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Import preserved Moon Relic app and assets unchanged"
            git push origin HEAD:main
          fi
      - name: Report deployment readiness
        run: |
          echo '## BSEG application imported' >> "$GITHUB_STEP_SUMMARY"
          echo 'The existing application is now in public/. No app code was rebuilt or restyled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare Pages: framework None; branch main; build command node prepare-site.mjs; output directory public.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A Cloudflare deployment and live website URL still require the Cloudflare account connection.' >> "$GITHUB_STEP_SUMMARY"
